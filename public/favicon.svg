<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Rich Multi-Stop Vibrant Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#6B21A8" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>

    <!-- Top Soft Ambient Lighting -->
    <radialGradient id="topGlow" cx="50%" cy="15%" r="75%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#6B21A8" stop-opacity="0" />
    </radialGradient>

    <!-- Strong Drop Shadow for High Contrast Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1E0538" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- M3 Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)" />

  <!-- Top Ambient Glow -->
  <rect width="512" height="512" rx="128" fill="url(#topGlow)" />

  <!-- Crisp Inner Border Highlight -->
  <rect x="10" y="10" width="492" height="492" rx="118" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5" />

  <!-- Large, Extra-Thick 'S' Typography Logo -->
  <text
    x="256"
    y="278"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, 'Arial Black', sans-serif"
    font-size="370"
    font-weight="900"
    letter-spacing="-10"
    text-anchor="middle"
    dominant-baseline="central"
    fill="#FFFFFF"
    filter="url(#shadow)"
  >S</text>
</svg>
