<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="m3Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F67BE" />
      <stop offset="100%" stop-color="#4F378A" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8DEF8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Outer M3 Rounded Shape (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#m3Gradient)" />
  
  <!-- Inner subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4" />
  
  <!-- Bold Stylized 'S' Logo -->
  <path 
    d="M 330 150 
       C 330 150, 200 130, 200 215 
       C 200 280, 315 285, 315 350 
       C 315 410, 210 400, 180 370" 
    fill="none" 
    stroke="url(#accentGradient)" 
    stroke-width="58" 
    stroke-linecap="round" 
    filter="url(#shadow)"
  />
  
  <!-- Modern Geometric Accent Dots -->
  <circle cx="345" cy="150" r="14" fill="#D0BCFF" />
  <circle cx="165" cy="370" r="14" fill="#D0BCFF" />
</svg>
